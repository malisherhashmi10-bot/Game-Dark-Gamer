<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>🔥 Dark Gamer Racing</title>


<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#050505;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}

body{

    display:flex;

    justify-content:center;

    align-items:center;

}


/* =========================
   GAME
========================= */

#game{

    width:360px;

    height:650px;

    max-width:100vw;

    max-height:100vh;

    position:relative;

    overflow:hidden;

    background:#222;

    border-left:
    7px solid #00ffff;

    border-right:
    7px solid #ff00ff;

    box-shadow:

    0 0 15px #00ffff,

    0 0 30px #ff00ff;

}


/* =========================
   ROAD
========================= */

#road{

    position:absolute;

    inset:0;

    background:

    linear-gradient(
        90deg,
        #171717 0%,
        #343434 12%,
        #292929 50%,
        #343434 88%,
        #171717 100%
    );

}


/* MOVING NEON GLOW */

#road::before{

    content:"";

    position:absolute;

    width:180%;

    height:180%;

    left:-40%;

    top:-40%;

    background:

    radial-gradient(
        circle at 20% 30%,
        rgba(255,0,255,.18),
        transparent 22%
    ),

    radial-gradient(
        circle at 80% 70%,
        rgba(0,255,255,.18),
        transparent 22%
    );

    animation:

    neonMove
    5s
    ease-in-out
    infinite
    alternate;

}


@keyframes neonMove{

    0%{

        transform:
        rotate(0deg)
        scale(1);

        filter:
        hue-rotate(0deg);

    }

    100%{

        transform:
        rotate(15deg)
        scale(1.25);

        filter:
        hue-rotate(180deg);

    }

}


/* =========================
   ROAD LINES
========================= */

.line{

    position:absolute;

    width:7px;

    height:90px;

    left:50%;

    transform:
    translateX(-50%);

    background:white;

    border-radius:5px;

    box-shadow:
    0 0 10px white;

    z-index:3;

}


/* =========================
   TITLE
========================= */

#title{

    position:absolute;

    top:43px;

    width:100%;

    text-align:center;

    z-index:30;

    font-size:18px;

    font-weight:bold;

    color:white;

    letter-spacing:2px;

    text-shadow:

    0 0 5px #00ffff,

    0 0 12px #00ffff,

    0 0 20px #ff00ff;

}


/* =========================
   SCORE
========================= */

#score{

    position:absolute;

    top:10px;

    left:10px;

    z-index:35;

    padding:
    7px 11px;

    background:
    rgba(0,0,0,.9);

    color:#00ffff;

    border:
    2px solid #00ffff;

    border-radius:8px;

    font-weight:bold;

    box-shadow:
    0 0 10px #00ffff;

}


/* =========================
   MUSIC
========================= */

#music{

    position:absolute;

    top:10px;

    right:10px;

    z-index:35;

    padding:
    7px 9px;

    color:#00ffff;

    background:#111;

    border:
    2px solid #00ffff;

    border-radius:8px;

    font-weight:bold;

}


/* =========================
   SPORTS CAR
========================= */

#player{

    position:absolute;

    width:60px;

    height:96px;

    left:150px;

    /*
       CAR اوپر رکھی گئی ہے
    */

    bottom:190px;

    z-index:15;

    border-radius:
    16px 16px 11px 11px;

    background:

    linear-gradient(
        90deg,
        #420000 0%,
        #b80000 12%,
        #ff2020 35%,
        #ff5555 50%,
        #d00000 68%,
        #720000 88%,
        #350000 100%
    );

    border:
    2px solid white;

    box-shadow:

    0 0 8px #ff0000,

    0 0 20px #ff0000,

    inset 0 0 15px
    rgba(255,255,255,.2);

    transition:
    transform .06s;

}


/* CAR CENTER STRIPE */

#player .stripe{

    position:absolute;

    left:26px;

    top:0;

    width:7px;

    height:100%;

    background:
    linear-gradient(
        180deg,
        #ffffff,
        #00ffff,
        #ffffff
    );

    opacity:.8;

    box-shadow:
    0 0 6px #00ffff;

}


/* FRONT WINDSHIELD */

#player .windshield{

    position:absolute;

    left:9px;

    top:10px;

    width:42px;

    height:27px;

    background:

    linear-gradient(
        135deg,
        #07131a,
        #00a9c7,
        #10232b
    );

    border:
    2px solid #bfffff;

    border-radius:
    9px 9px 5px 5px;

    transform:
    perspective(30px)
    rotateX(-5deg);

    box-shadow:
    0 0 8px #00ffff;

}


/* SIDE WINDOWS */

#player .sideWindow{

    position:absolute;

    width:8px;

    height:23px;

    top:13px;

    background:#061016;

    border:
    1px solid #00ffff;

    border-radius:4px;

}

#player .sideWindow.left{

    left:2px;

}

#player .sideWindow.right{

    right:2px;

}


/* SPOILER */

#player .spoiler{

    position:absolute;

    width:54px;

    height:8px;

    left:3px;

    top:-8px;

    background:#111;

    border:
    2px solid #ff00ff;

    border-radius:6px;

    box-shadow:
    0 0 9px #ff00ff;

}


/* SPOILER SUPPORT */

#player .spoilerSupport{

    position:absolute;

    width:6px;

    height:9px;

    top:-3px;

    background:#555;

}

#player .spoilerSupport.left{

    left:14px;

}

#player .spoilerSupport.right{

    right:14px;

}


/* WHEELS */

.wheel{

    position:absolute;

    width:10px;

    height:27px;

    background:#050505;

    border:
    2px solid #555;

    border-radius:5px;

    box-shadow:
    0 0 4px #000;

}

.wheel.l1{

    left:-7px;

    top:18px;

}

.wheel.r1{

    right:-7px;

    top:18px;

}

.wheel.l2{

    left:-7px;

    bottom:16px;

}

.wheel.r2{

    right:-7px;

    bottom:16px;

}


/* HEADLIGHTS */

.headlight{

    position:absolute;

    width:13px;

    height:7px;

    bottom:8px;

    background:#fffbd0;

    border-radius:5px;

    box-shadow:
    0 0 8px yellow,
    0 0 15px white;

}

.headlight.left{

    left:7px;

}

.headlight.right{

    right:7px;

}


/* REAR LIGHT */

.rearLight{

    position:absolute;

    width:42px;

    height:4px;

    left:9px;

    top:66px;

    background:#ff0033;

    box-shadow:
    0 0 8px red;

}


/* =========================
   ENEMY CARS
========================= */

.enemy{

    position:absolute;

    width:56px;

    height:88px;

    top:-110px;

    z-index:8;

    border-radius:
    14px;

    border:
    2px solid white;

    box-shadow:
    0 0 14px #0088ff;

}


.enemy::before{

    content:"";

    position:absolute;

    left:9px;

    top:9px;

    width:34px;

    height:24px;

    background:
    linear-gradient(
        135deg,
        #061016,
        #00a9c7,
        #071016
    );

    border:
    2px solid #8fffff;

    border-radius:7px;

}


/* =========================
   START
========================= */

#start{

    position:absolute;

    left:50%;

    top:50%;

    transform:
    translate(-50%,-50%);

    z-index:50;

    padding:
    16px 27px;

    background:
    linear-gradient(
        90deg,
        #ff0055,
        #9d00ff,
        #00ccff
    );

    color:white;

    border:
    3px solid white;

    border-radius:14px;

    font-size:19px;

    font-weight:bold;

    box-shadow:

    0 0 15px #ff0055,

    0 0 30px #00ffff;

}


/* =========================
   CONTROLS
========================= */

#controls{

    position:absolute;

    /*
       BUTTONS پہلے سے کافی اوپر
    */

    bottom:105px;

    left:0;

    width:100%;

    display:flex;

    justify-content:space-between;

    padding:
    0 18px;

    z-index:45;

}


/* BUTTON */

.control{

    width:112px;

    height:62px;

    background:
    linear-gradient(
        180deg,
        #181818,
        #050505
    );

    color:#fff;

    border:
    3px solid #00ffff;

    border-radius:16px;

    font-size:31px;

    font-weight:bold;

    box-shadow:

    0 0 10px #00ffff,

    inset 0 0 10px
    rgba(0,255,255,.15);

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;

}


/* BUTTON PRESSED */

.control.active{

    background:#00ffff;

    color:#000;

    transform:
    scale(.94);

    box-shadow:

    0 0 20px #00ffff,

    0 0 35px #00ffff;

}


/* =========================
   MOBILE
========================= */

@media(max-width:380px){

    #game{

        width:100vw;

        height:100vh;

    }

    #player{

        bottom:185px;

    }

    #controls{

        bottom:95px;

    }

    .control{

        width:105px;

        height:60px;

    }

}


/* SHORT SCREEN */

@media(max-height:600px){

    #player{

        bottom:165px;

    }

    #controls{

        bottom:75px;

    }

}

</style>

</head>


<body>


<div id="game">


    <!-- ROAD -->

    <div id="road">

        <div
        class="line"
        style="top:-100px">
        </div>

        <div
        class="line"
        style="top:100px">
        </div>

        <div
        class="line"
        style="top:300px">
        </div>

        <div
        class="line"
        style="top:500px">
        </div>

    </div>


    <!-- SCORE -->

    <div id="score">
        SCORE: 0
    </div>


    <!-- TITLE -->

    <div id="title">
        🔥 DARK GAMER 🔥
    </div>


    <!-- MUSIC -->

    <button id="music">
        🎧 MUSIC OFF
    </button>


    <!-- SPORTS CAR -->

    <div id="player">

        <div class="spoiler"></div>

        <div
        class="spoilerSupport left">
        </div>

        <div
        class="spoilerSupport right">
        </div>

        <div class="stripe"></div>

        <div class="windshield"></div>

        <div
        class="sideWindow left">
        </div>

        <div
        class="sideWindow right">
        </div>

        <div
        class="wheel l1">
        </div>

        <div
        class="wheel r1">
        </div>

        <div
        class="wheel l2">
        </div>

        <div
        class="wheel r2">
        </div>

        <div
        class="headlight left">
        </div>

        <div
        class="headlight right">
        </div>

        <div class="rearLight"></div>

    </div>


    <!-- START -->

    <button id="start">
        🏁 START RACE
    </button>


    <!-- CONTROLS -->

    <div id="controls">

        <button
        class="control"
        id="left">

            ⬅️

        </button>


        <button
        class="control"
        id="right">

            ➡️

        </button>

    </div>


</div>


<!-- MUSIC FILE -->

<audio
id="bgMusic"
src="phonk.mp3"
loop>
</audio>


<script>

/* =========================
   ELEMENTS
========================= */

const player =
document.getElementById("player");

const leftButton =
document.getElementById("left");

const rightButton =
document.getElementById("right");

const startButton =
document.getElementById("start");

const scoreBox =
document.getElementById("score");

const musicButton =
document.getElementById("music");

const music =
document.getElementById("bgMusic");


/* =========================
   VARIABLES
========================= */

let x = 150;

let speed = 5;

let score = 0;

let playing = false;

let enemies = [];

let enemyTimer = null;

let leftHeld = false;

let rightHeld = false;

let gameRunning = false;


/* =========================
   START
========================= */

startButton.addEventListener(
"click",
function(){

    playing = true;

    gameRunning = true;

    score = 0;

    speed = 5;

    x = 150;

    player.style.left =
    x + "px";

    scoreBox.innerText =
    "SCORE: 0";

    startButton.style.display =
    "none";


    enemies.forEach(
        function(enemy){
            enemy.remove();
        }
    );

    enemies = [];


    clearInterval(enemyTimer);


    createEnemy();


    enemyTimer =
    setInterval(
        createEnemy,
        1100
    );


    requestAnimationFrame(
        gameLoop
    );

});


/* =========================
   CREATE ENEMY
========================= */

function createEnemy(){

    if(!playing){
        return;
    }


    const enemy =
    document.createElement("div");


    enemy.className =
    "enemy";


    const lanes =
    [30,150,270];


    const lane =
    lanes[
        Math.floor(
            Math.random() *
            lanes.length
        )
    ];


    enemy.style.left =
    lane + "px";


    enemy.style.top =
    "-110px";


    const colors =
    [
        "#075dff",
        "#e5008a",
        "#00a85a",
        "#ff6500",
        "#7b00ff"
    ];


    enemy.style.background =
    colors[
        Math.floor(
            Math.random() *
            colors.length
        )
    ];


    document
    .getElementById("game")
    .appendChild(enemy);


    enemies.push(enemy);

}


/* =========================
   HOLD LEFT
========================= */

function startLeft(e){

    if(e){
        e.preventDefault();
    }

    if(!playing){
        return;
    }

    leftHeld = true;

    leftButton.classList.add(
        "active"
    );

}


/* =========================
   HOLD RIGHT
========================= */

function startRight(e){

    if(e){
        e.preventDefault();
    }

    if(!playing){
        return;
    }

    rightHeld = true;

    rightButton.classList.add(
        "active"
    );

}


/* =========================
   RELEASE
========================= */

function stopSteering(){

    leftHeld = false;

    rightHeld = false;

    leftButton.classList.remove(
        "active"
    );

    rightButton.classList.remove(
        "active"
    );

}


/* =========================
   TOUCH / POINTER
========================= */

leftButton.addEventListener(
"pointerdown",
startLeft
);


rightButton.addEventListener(
"pointerdown",
startRight
);


window.addEventListener(
"pointerup",
stopSteering
);


window.addEventListener(
"pointercancel",
stopSteering
);


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
"keydown",
function(e){

    if(e.key === "ArrowLeft"){

        startLeft();

    }


    if(e.key === "ArrowRight"){

        startRight();

    }

});


window.addEventListener(
"keyup",
function(e){

    if(
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight"
    ){

        stopSteering();

    }

});


/* =========================
   SMOOTH STEERING
========================= */

function steeringLoop(){

    if(
        playing &&
        gameRunning
    ){

        if(leftHeld){

            x -= 6;

        }


        if(rightHeld){

            x += 6;

        }


        /* ROAD LIMIT */

        if(x < 12){

            x = 12;

        }


        if(x > 290){

            x = 290;

        }


        player.style.left =
        x + "px";


        /* CAR TILT */

        if(leftHeld){

            player.style.transform =
            "rotate(-8deg)";

        }

        else if(rightHeld){

            player.style.transform =
            "rotate(8deg)";

        }

        else{

            player.style.transform =
            "rotate(0deg)";

        }

    }


    requestAnimationFrame(
        steeringLoop
    );

}


requestAnimationFrame(
    steeringLoop
);


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    if(!playing){

        return;

    }


    /* ROAD */

    document
    .querySelectorAll(".line")
    .forEach(
        function(line){

            let y =
            parseFloat(
                line.style.top
            );


            y += speed;


            if(y > 650){

                y = -100;

            }


            line.style.top =
            y + "px";

        }
    );


    /* ENEMIES */

    for(
        let i =
        enemies.length - 1;

        i >= 0;

        i--
    ){

        const enemy =
        enemies[i];


        let y =
        parseFloat(
            enemy.style.top
        );


        y += speed;


        enemy.style.top =
        y + "px";


        /* COLLISION */

        const playerBox =
        player.getBoundingClientRect();


        const enemyBox =
        enemy.getBoundingClientRect();


        const margin = 8;


        if(

            playerBox.left + margin
            <
            enemyBox.right - margin

            &&

            playerBox.right - margin
            >
            enemyBox.left + margin

            &&

            playerBox.top + margin
            <
            enemyBox.bottom - margin

            &&

            playerBox.bottom - margin
            >
            enemyBox.top + margin

        ){

            gameOver();

            return;

        }


        /* SCORE */

        if(y > 650){

            enemy.remove();

            enemies.splice(i,1);

            score++;


            scoreBox.innerText =
            "SCORE: " + score;


            /* SPEED */

            if(
                score > 0 &&
                score % 5 === 0
            ){

                speed += .5;

            }

        }

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    playing = false;

    gameRunning = false;

    leftHeld = false;

    rightHeld = false;

    stopSteering();

    clearInterval(
        enemyTimer
    );


    alert(
        "💥 GAME OVER!\n\n" +
        "🏆 SCORE: " +
        score
    );


    location.reload();

}


/* =========================
   MUSIC
========================= */

musicButton.addEventListener(
"click",
function(){

    if(
        music.paused
    ){

        music.play()
        .then(
            function(){

                musicButton.innerText =
                "🔊 MUSIC ON";

            }
        )
        .catch(
            function(){

                alert(
                    "🎧 پہلے GitHub میں اپنی phonk.mp3 فائل upload کریں۔"
                );

            }
        );

    }

    else{

        music.pause();

        musicButton.innerText =
        "🎧 MUSIC OFF";

    }

});

</script>


</body>

</html>
