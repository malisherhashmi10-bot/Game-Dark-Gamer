<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Gamer Racing</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    font-family:Arial,sans-serif;
    overflow:hidden;
    color:white;
}

/* MAIN GAME */

#game{
    width:360px;
    height:650px;
    max-width:100vw;
    max-height:100vh;
    margin:auto;
    position:relative;
    overflow:hidden;

    background:linear-gradient(
        180deg,
        #111,
        #333,
        #111
    );

    border-left:8px solid #00ffff;
    border-right:8px solid #ff00ff;

    box-shadow:
        0 0 20px #00ffff,
        0 0 40px #ff00ff;
}

/* ANIMATED BACKGROUND */

#game::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,0,255,.25),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(0,255,255,.25),
            transparent 25%
        );

    animation:bgMove 4s infinite alternate;
}

@keyframes bgMove{

    0%{
        filter:hue-rotate(0deg);
        transform:scale(1);
    }

    100%{
        filter:hue-rotate(180deg);
        transform:scale(1.3);
    }

}

/* ROAD */

#road{
    position:absolute;
    width:100%;
    height:100%;
    background:#333;
}

/* ROAD LINES */

.line{
    position:absolute;
    width:8px;
    height:90px;
    background:white;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 0 10px white;
}

/* PLAYER CAR */

#player{
    position:absolute;

    width:50px;
    height:85px;

    left:155px;

    /* CAR کو اوپر کیا گیا */
    bottom:105px;

    background:
        linear-gradient(
            90deg,
            #ff0000,
            #ff5555,
            #990000
        );

    border:3px solid white;

    border-radius:12px;

    z-index:10;

    box-shadow:
        0 0 10px red,
        0 0 25px red;

    transition:transform .08s;
}

/* CAR WINDOW */

#player::before{
    content:"";

    position:absolute;

    width:28px;
    height:25px;

    left:8px;
    top:8px;

    background:#111;

    border:2px solid #00ffff;

    border-radius:6px;
}

/* CAR LIGHT */

#player::after{
    content:"";

    position:absolute;

    width:35px;
    height:5px;

    left:5px;
    bottom:7px;

    background:#ffff00;

    box-shadow:
        0 0 10px yellow;
}

/* ENEMY */

.enemy{
    position:absolute;

    width:50px;
    height:85px;

    top:-100px;

    border-radius:12px;

    border:3px solid white;

    z-index:5;

    box-shadow:
        0 0 15px blue;
}

/* SCORE */

#score{
    position:absolute;

    top:12px;
    left:12px;

    color:#00ffff;

    background:rgba(0,0,0,.8);

    padding:8px 12px;

    border:2px solid #00ffff;

    border-radius:8px;

    z-index:30;

    font-weight:bold;

    box-shadow:0 0 10px #00ffff;
}

/* TITLE */

#title{
    position:absolute;

    top:50px;

    width:100%;

    text-align:center;

    color:#fff;

    font-size:18px;

    font-weight:bold;

    text-shadow:
        0 0 5px #00ffff,
        0 0 15px #ff00ff;

    z-index:20;
}

/* START BUTTON */

#start{

    position:absolute;

    z-index:40;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    padding:16px 35px;

    background:#ff0055;

    color:white;

    border:3px solid white;

    border-radius:12px;

    font-size:21px;

    font-weight:bold;

    box-shadow:
        0 0 15px #ff0055,
        0 0 30px #ff00ff;

    cursor:pointer;
}

/* MUSIC BUTTON */

#music{

    position:absolute;

    top:12px;
    right:12px;

    z-index:35;

    background:#111;

    color:#00ffff;

    border:2px solid #00ffff;

    border-radius:8px;

    padding:8px;

    cursor:pointer;
}

/* CONTROLS */

#controls{

    position:absolute;

    left:0;

    bottom:12px;

    width:100%;

    display:flex;

    justify-content:space-between;

    padding:0 15px;

    z-index:30;

    pointer-events:auto;
}

/* CONTROL BUTTON */

.control{

    width:105px;
    height:58px;

    background:rgba(0,0,0,.85);

    color:white;

    border:3px solid #00ffff;

    border-radius:14px;

    font-size:28px;

    font-weight:bold;

    box-shadow:
        0 0 10px #00ffff;

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;
}

.control:active{

    transform:scale(.92);

    background:#00ffff;

    color:#000;

}

/* SMALL SCREEN */

@media(max-height:680px){

    #game{
        height:100vh;
    }

    #player{
        bottom:95px;
    }

    #controls{
        bottom:8px;
    }

}

</style>
</head>

<body>

<div id="game">

    <div id="road">

        <div class="line" style="top:-100px"></div>
        <div class="line" style="top:100px"></div>
        <div class="line" style="top:300px"></div>
        <div class="line" style="top:500px"></div>

    </div>


    <div id="title">
        🔥 DARK GAMER 🔥
    </div>


    <div id="score">
        SCORE: 0
    </div>


    <button id="music">
        🔇 MUSIC
    </button>


    <div id="player"></div>


    <button id="start">
        🏁 START RACE
    </button>


    <!-- CONTROLS -->

    <div id="controls">

        <button
            class="control"
            id="left">
            ⬅️
        </button>

        <button
            class="control"
            id="right">
            ➡️
        </button>

    </div>

</div>


<script>

/* ELEMENTS */

const player =
    document.getElementById("player");

const left =
    document.getElementById("left");

const right =
    document.getElementById("right");

const start =
    document.getElementById("start");

const scoreBox =
    document.getElementById("score");

const game =
    document.getElementById("game");

const music =
    document.getElementById("music");


/* VARIABLES */

let x = 155;

let speed = 5;

let score = 0;

let playing = false;

let enemies = [];

let leftDown = false;

let rightDown = false;

let enemyTimer;


/* START GAME */

start.onclick = function(){

    playing = true;

    score = 0;

    speed = 5;

    x = 155;

    player.style.left =
        x + "px";

    scoreBox.innerText =
        "SCORE: 0";

    start.style.display =
        "none";


    enemies.forEach(function(enemy){

        enemy.remove();

    });

    enemies = [];


    createEnemy();


    clearInterval(enemyTimer);

    enemyTimer =
        setInterval(
            createEnemy,
            1100
        );


    requestAnimationFrame(loop);

};


/* CREATE ENEMY */

function createEnemy(){

    if(!playing) return;


    const enemy =
        document.createElement("div");

    enemy.className =
        "enemy";


    const lanes =
        [35,155,275];


    const lane =
        lanes[
            Math.floor(
                Math.random()*lanes.length
            )
        ];


    enemy.style.left =
        lane + "px";


    enemy.style.top =
        "-100px";


    const colors =
        [
            "#0066ff",
            "#ff00aa",
            "#00cc66",
            "#ff6600"
        ];


    enemy.style.background =
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ];


    game.appendChild(enemy);

    enemies.push(enemy);

}


/* LEFT CONTROL */

function moveLeft(){

    if(!playing) return;

    x -= 18;

    if(x < 15){
        x = 15;
    }

    player.style.left =
        x + "px";

    player.style.transform =
        "rotate(-6deg)";

}


/* RIGHT CONTROL */

function moveRight(){

    if(!playing) return;

    x += 18;

    if(x > 295){
        x = 295;
    }

    player.style.left =
        x + "px";

    player.style.transform =
        "rotate(6deg)";

}


/* TOUCH / POINTER LEFT */

left.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        moveLeft();

    }
);


/* TOUCH / POINTER RIGHT */

right.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        moveRight();

    }
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowLeft"){

            e.preventDefault();

            moveLeft();

        }


        if(e.key === "ArrowRight"){

            e.preventDefault();

            moveRight();

        }

    }
);


/* RESET CAR ANGLE */

document.addEventListener(
    "pointerup",
    function(){

        player.style.transform =
            "rotate(0deg)";

    }
);


/* GAME LOOP */

function loop(){

    if(!playing) return;


    /* ROAD LINES */

    document
    .querySelectorAll(".line")
    .forEach(function(line){

        let y =
            parseFloat(
                line.style.top
            );


        y += speed;


        if(y > 650){

            y = -100;

        }


        line.style.top =
            y + "px";

    });


    /* ENEMIES */

    for(
        let i = enemies.length - 1;
        i >= 0;
        i--
    ){

        const enemy =
            enemies[i];


        let y =
            parseFloat(
                enemy.style.top
            );


        y += speed;


        enemy.style.top =
            y + "px";


        /* COLLISION */

        const p =
            player.getBoundingClientRect();

        const e =
            enemy.getBoundingClientRect();


        if(

            p.left < e.right &&
            p.right > e.left &&
            p.top < e.bottom &&
            p.bottom > e.top

        ){

            gameOver();

            return;

        }


        /* SCORE */

        if(y > 650){

            enemy.remove();

            enemies.splice(i,1);

            score++;


            scoreBox.innerText =
                "SCORE: " + score;


            /* INCREASE SPEED */

            if(score % 5 === 0){

                speed += 0.5;

            }

        }

    }


    requestAnimationFrame(loop);

}


/* GAME OVER */

function gameOver(){

    playing = false;

    clearInterval(enemyTimer);

    alert(
        "💥 GAME OVER!\n\n" +
        "🏆 SCORE: " + score
    );

    location.reload();

}


/* MUSIC BUTTON */

/*
   یہاں بعد میں اپنی MP3 فائل لگا سکتے ہیں۔
*/

let audio =
    new Audio();

audio.loop = true;


/* MUSIC BUTTON */

music.onclick = function(){

    if(audio.paused){

        /*
        اپنی music file کا نام
        یہاں لکھ سکتے ہیں:

        audio.src = "phonk.mp3";
        */

        if(!audio.src){

            alert(
                "🎧 اپنی phonk.mp3 فائل upload کریں!"
            );

            return;

        }

        audio.play();

        music.innerText =
            "🔊 MUSIC ON";

    }

    else{

        audio.pause();

        music.innerText =
            "🔇 MUSIC";

    }

};

</script>

</body>
</html>
