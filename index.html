<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Gamer Racing</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    font-family:Arial,sans-serif;
    overflow:hidden;
    color:white;
}

/* GAME */

#game{
    width:360px;
    height:650px;
    max-width:100vw;
    max-height:100vh;
    margin:auto;

    position:relative;
    overflow:hidden;

    background:#333;

    border-left:7px solid #00ffff;
    border-right:7px solid #ff00ff;

    box-shadow:
        0 0 15px #00ffff,
        0 0 30px #ff00ff;
}

/* ROAD */

#road{
    position:absolute;
    width:100%;
    height:100%;
    background:#333;
}

/* ANIMATED LIGHT */

#road::after{
    content:"";

    position:absolute;

    width:200%;
    height:200%;

    left:-50%;
    top:-50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,255,.15),
            transparent 30%
        );

    animation:
        roadGlow 4s infinite alternate;
}

@keyframes roadGlow{

    0%{
        transform:rotate(0deg);
        filter:hue-rotate(0deg);
    }

    100%{
        transform:rotate(20deg);
        filter:hue-rotate(180deg);
    }
}

/* ROAD LINES */

.line{
    position:absolute;

    width:8px;
    height:90px;

    background:white;

    left:50%;

    transform:translateX(-50%);

    box-shadow:0 0 10px white;

    z-index:2;
}

/* TITLE */

#title{
    position:absolute;

    top:45px;

    width:100%;

    text-align:center;

    font-size:18px;
    font-weight:bold;

    color:white;

    text-shadow:
        0 0 5px #00ffff,
        0 0 15px #ff00ff;

    z-index:20;
}

/* SCORE */

#score{
    position:absolute;

    top:10px;
    left:10px;

    background:#000;

    color:#00ffff;

    padding:7px 10px;

    border:2px solid #00ffff;

    border-radius:7px;

    font-weight:bold;

    z-index:25;
}

/* MUSIC */

#music{
    position:absolute;

    top:10px;
    right:10px;

    padding:7px 9px;

    background:#111;

    color:#00ffff;

    border:2px solid #00ffff;

    border-radius:7px;

    z-index:25;
}

/* PLAYER CAR */

#player{
    position:absolute;

    width:50px;
    height:85px;

    left:155px;

    /*
       🚗 CAR کو کافی اوپر رکھا گیا
    */
    bottom:155px;

    background:
        linear-gradient(
            90deg,
            #b00000,
            #ff2222,
            #990000
        );

    border:3px solid white;

    border-radius:12px;

    z-index:10;

    box-shadow:
        0 0 10px red,
        0 0 25px red;

    transition:
        left .08s,
        transform .08s;
}

/* WINDOW */

#player::before{
    content:"";

    position:absolute;

    width:28px;
    height:25px;

    left:8px;
    top:8px;

    background:#111;

    border:2px solid #00ffff;

    border-radius:6px;
}

/* LIGHT */

#player::after{
    content:"";

    position:absolute;

    width:35px;
    height:5px;

    left:5px;

    bottom:7px;

    background:#ffff00;

    box-shadow:
        0 0 10px yellow;
}

/* ENEMY */

.enemy{
    position:absolute;

    width:50px;
    height:85px;

    top:-100px;

    border-radius:12px;

    border:3px solid white;

    z-index:5;

    box-shadow:
        0 0 12px blue;
}

/* START */

#start{
    position:absolute;

    z-index:40;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    padding:15px 30px;

    background:#ff0055;

    color:white;

    border:3px solid white;

    border-radius:12px;

    font-size:20px;

    font-weight:bold;

    box-shadow:
        0 0 15px #ff0055,
        0 0 30px #ff00ff;
}

/* CONTROLS */

#controls{

    position:absolute;

    /*
       🎮 BUTTONS کو بھی کافی اوپر کیا گیا
    */
    bottom:55px;

    left:0;

    width:100%;

    display:flex;

    justify-content:space-between;

    padding:0 18px;

    z-index:35;
}

/* BUTTON */

.control{

    width:110px;
    height:62px;

    background:rgba(0,0,0,.9);

    color:white;

    border:3px solid #00ffff;

    border-radius:14px;

    font-size:30px;

    font-weight:bold;

    box-shadow:
        0 0 12px #00ffff;

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;
}

/* BUTTON PRESS */

.control:active{

    transform:scale(.90);

    background:#00ffff;

    color:#000;

}

/* SMALL PHONE */

@media(max-width:380px){

    #game{
        width:100vw;
        height:100vh;
    }

    #player{
        bottom:145px;
    }

    #controls{
        bottom:45px;
    }

    .control{
        width:100px;
        height:58px;
    }

}

/* VERY SHORT SCREEN */

@media(max-height:600px){

    #game{
        height:100vh;
    }

    #player{
        bottom:125px;
    }

    #controls{
        bottom:35px;
    }

}

</style>
</head>

<body>

<div id="game">

    <div id="road">

        <div class="line" style="top:-100px"></div>
        <div class="line" style="top:100px"></div>
        <div class="line" style="top:300px"></div>
        <div class="line" style="top:500px"></div>

    </div>

    <div id="score">
        SCORE: 0
    </div>

    <div id="music">
        🔇 MUSIC
    </div>

    <div id="title">
        🔥 DARK GAMER 🔥
    </div>

    <div id="player"></div>

    <button id="start">
        🏁 START RACE
    </button>

    <!-- CONTROLS -->

    <div id="controls">

        <button
            class="control"
            id="left">
            ⬅️
        </button>

        <button
            class="control"
            id="right">
            ➡️
        </button>

    </div>

</div>


<script>

/* ELEMENTS */

const player =
    document.getElementById("player");

const left =
    document.getElementById("left");

const right =
    document.getElementById("right");

const start =
    document.getElementById("start");

const scoreBox =
    document.getElementById("score");

const game =
    document.getElementById("game");


/* VARIABLES */

let x = 155;

let speed = 5;

let score = 0;

let playing = false;

let enemies = [];

let enemyTimer;


/* START */

start.onclick = function(){

    playing = true;

    score = 0;

    speed = 5;

    x = 155;

    player.style.left =
        x + "px";

    scoreBox.innerText =
        "SCORE: 0";

    start.style.display =
        "none";


    enemies.forEach(function(enemy){
        enemy.remove();
    });

    enemies = [];


    clearInterval(enemyTimer);


    createEnemy();


    enemyTimer =
        setInterval(
            createEnemy,
            1100
        );


    requestAnimationFrame(loop);

};


/* CREATE ENEMY */

function createEnemy(){

    if(!playing) return;


    const enemy =
        document.createElement("div");

    enemy.className =
        "enemy";


    const lanes =
        [35,155,275];


    const lane =
        lanes[
            Math.floor(
                Math.random()*3
            )
        ];


    enemy.style.left =
        lane + "px";


    enemy.style.top =
        "-100px";


    const colors = [
        "#0066ff",
        "#ff00aa",
        "#00cc66",
        "#ff6600"
    ];


    enemy.style.background =
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ];


    game.appendChild(enemy);

    enemies.push(enemy);

}


/* MOVE LEFT */

function moveLeft(){

    if(!playing) return;

    x -= 20;


    if(x < 15){
        x = 15;
    }


    player.style.left =
        x + "px";


    player.style.transform =
        "rotate(-7deg)";

}


/* MOVE RIGHT */

function moveRight(){

    if(!playing) return;

    x += 20;


    if(x > 295){
        x = 295;
    }


    player.style.left =
        x + "px";


    player.style.transform =
        "rotate(7deg)";

}


/* MOBILE LEFT */

left.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        moveLeft();

    }
);


/* MOBILE RIGHT */

right.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        moveRight();

    }
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowLeft"){

            e.preventDefault();

            moveLeft();

        }


        if(e.key === "ArrowRight"){

            e.preventDefault();

            moveRight();

        }

    }
);


/* RESET ROTATION */

document.addEventListener(
    "pointerup",
    function(){

        player.style.transform =
            "rotate(0deg)";

    }
);


/* GAME LOOP */

function loop(){

    if(!playing) return;


    /* ROAD */

    document
    .querySelectorAll(".line")
    .forEach(function(line){

        let y =
            parseFloat(
                line.style.top
            );


        y += speed;


        if(y > 650){
            y = -100;
        }


        line.style.top =
            y + "px";

    });


    /* ENEMIES */

    for(
        let i = enemies.length - 1;
        i >= 0;
        i--
    ){

        const enemy =
            enemies[i];


        let y =
            parseFloat(
                enemy.style.top
            );


        y += speed;


        enemy.style.top =
            y + "px";


        /* COLLISION */

        const p =
            player.getBoundingClientRect();

        const e =
            enemy.getBoundingClientRect();


        if(
            p.left < e.right &&
            p.right > e.left &&
            p.top < e.bottom &&
            p.bottom > e.top
        ){

            gameOver();

            return;

        }


        /* SCORE */

        if(y > 650){

            enemy.remove();

            enemies.splice(i,1);

            score++;


            scoreBox.innerText =
                "SCORE: " + score;


            if(score % 5 === 0){

                speed += 0.5;

            }

        }

    }


    requestAnimationFrame(loop);

}


/* GAME OVER */

function gameOver(){

    playing = false;

    clearInterval(enemyTimer);

    alert(
        "💥 GAME OVER!\n\n" +
        "🏆 SCORE: " + score
    );

    location.reload();

}

</script>

</body>
</html>
