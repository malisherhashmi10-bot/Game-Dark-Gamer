<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Game</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#111;
    overflow:hidden;
    font-family:Arial;
    text-align:center;
}

#game{
    width:360px;
    height:600px;
    max-width:100vw;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:#444;
    border-left:10px solid #222;
    border-right:10px solid #222;
}

#road{
    position:absolute;
    width:100%;
    height:100%;
    background:#444;
}

.line{
    position:absolute;
    width:8px;
    height:90px;
    background:white;
    left:50%;
}

#player{
    position:absolute;
    width:50px;
    height:85px;
    background:red;
    border-radius:12px;
    bottom:30px;
    left:155px;
    z-index:10;
    border:3px solid white;
}

.enemy{
    position:absolute;
    width:50px;
    height:85px;
    top:-100px;
    border-radius:12px;
    z-index:5;
    border:3px solid white;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    background:#000;
    padding:8px;
    z-index:20;
    border-radius:6px;
}

#start{
    position:absolute;
    z-index:30;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:15px 30px;
    background:red;
    color:white;
    border:0;
    border-radius:10px;
    font-size:20px;
}

#controls{
    width:360px;
    max-width:100%;
    margin:15px auto;
    display:flex;
    justify-content:space-around;
}

.control{
    width:120px;
    height:65px;
    background:#222;
    color:white;
    border:2px solid white;
    border-radius:12px;
    font-size:30px;
    touch-action:none;
}
</style>
</head>

<body>

<div id="game">

    <div id="road">

        <div class="line" style="top:-100px"></div>
        <div class="line" style="top:100px"></div>
        <div class="line" style="top:300px"></div>
        <div class="line" style="top:500px"></div>

    </div>

    <div id="score">
        Score: 0
    </div>

    <div id="player"></div>

    <button id="start">
        START
    </button>

</div>

<div id="controls">

    <button class="control" id="left">
        ⬅️
    </button>

    <button class="control" id="right">
        ➡️
    </button>

</div>


<script>

let player =
    document.getElementById("player");

let left =
    document.getElementById("left");

let right =
    document.getElementById("right");

let start =
    document.getElementById("start");

let scoreBox =
    document.getElementById("score");

let game =
    document.getElementById("game");


let x = 155;

let speed = 5;

let score = 0;

let playing = false;

let enemies = [];

let leftDown = false;

let rightDown = false;


/* START */

start.onclick = function(){

    playing = true;

    score = 0;

    speed = 5;

    x = 155;

    player.style.left =
        x + "px";

    scoreBox.innerText =
        "Score: 0";

    start.style.display =
        "none";

    enemies.forEach(e => e.remove());

    enemies = [];

    createEnemy();

    setInterval(createEnemy,1200);

    loop();

};


/* CREATE ENEMY */

function createEnemy(){

    if(!playing) return;

    let enemy =
        document.createElement("div");

    enemy.className =
        "enemy";

    let lanes =
        [35,155,275];

    let lane =
        lanes[
            Math.floor(
                Math.random()*3
            )
        ];

    enemy.style.left =
        lane + "px";

    enemy.style.top =
        "-100px";

    enemy.style.background =
        "blue";

    game.appendChild(enemy);

    enemies.push(enemy);

}


/* LEFT BUTTON */

left.onpointerdown = function(e){

    e.preventDefault();

    leftDown = true;

};

left.onpointerup = function(){

    leftDown = false;

};

left.onpointercancel = function(){

    leftDown = false;

};

left.onpointerleave = function(){

    leftDown = false;

};


/* RIGHT BUTTON */

right.onpointerdown = function(e){

    e.preventDefault();

    rightDown = true;

};

right.onpointerup = function(){

    rightDown = false;

};

right.onpointercancel = function(){

    rightDown = false;

};

right.onpointerleave = function(){

    rightDown = false;

};


/* KEYBOARD */

document.onkeydown = function(e){

    if(e.key === "ArrowLeft"){

        leftDown = true;

    }

    if(e.key === "ArrowRight"){

        rightDown = true;

    }

};


document.onkeyup = function(e){

    if(e.key === "ArrowLeft"){

        leftDown = false;

    }

    if(e.key === "ArrowRight"){

        rightDown = false;

    }

};


/* GAME LOOP */

function loop(){

    if(!playing) return;


    /* CAR MOVEMENT */

    if(leftDown){

        x -= 6;

    }

    if(rightDown){

        x += 6;

    }


    /* ROAD LIMIT */

    if(x < 15){

        x = 15;

    }

    if(x > 295){

        x = 295;

    }


    player.style.left =
        x + "px";


    /* ROAD LINES */

    document
    .querySelectorAll(".line")
    .forEach(function(line){

        let y =
            parseFloat(line.style.top);

        y += speed;

        if(y > 600){

            y = -100;

        }

        line.style.top =
            y + "px";

    });


    /* ENEMIES */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        let enemy =
            enemies[i];

        let y =
            parseFloat(enemy.style.top);

        y += speed;

        enemy.style.top =
            y + "px";


        /* COLLISION */

        let p =
            player.getBoundingClientRect();

        let e =
            enemy.getBoundingClientRect();


        if(
            p.left < e.right &&
            p.right > e.left &&
            p.top < e.bottom &&
            p.bottom > e.top
        ){

            playing = false;

            alert(
                "GAME OVER!\nScore: "
                + score
            );

            location.reload();

            return;

        }


        /* SCORE */

        if(y > 600){

            enemy.remove();

            enemies.splice(i,1);

            score++;

            scoreBox.innerText =
                "Score: " + score;


            if(score % 5 === 0){

                speed += 0.5;

            }

        }

    }


    requestAnimationFrame(loop);

}

</script>

</body>
</html>
